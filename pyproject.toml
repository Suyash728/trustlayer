[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "killscore"
dynamic = ["version"]
description = "Mechanical checks for AI-written code and mutation-verified tests. Hallucinated APIs, slopsquatted dependencies, and assertions that can't fail. No LLM produces a verdict."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suyash Kerkar" }]
keywords = ["ai", "testing", "mutation-testing", "slopsquatting", "static-analysis", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.2.128",
    "anyio>=4.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "packaging>=23.0",
    "textual>=8.2",
    "uvicorn>=0.30",
    "mcp>=1.29,<2",  # FastMCP verified on 1.29; 2.x renamed it (MCPServer) and changed APIs
]

[project.urls]
Homepage = "https://github.com/Suyash728/killscore"
Repository = "https://github.com/Suyash728/killscore"
Issues = "https://github.com/Suyash728/killscore/issues"

[project.scripts]
killscore = "killscore.cli:main_entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "killscore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["killscore"]
# node_modules is gitignored, so hatch already leaves it out; this keeps it out explicitly.
exclude = ["killscore/checks/node/node_modules"]

# The data files live at the repo root (scripts and the workflow maintain them there) and
# are copied into the wheel, so `uvx killscore` has its registry and corpora. Without this
# an installed wheel skips stale-models and scores slopsquat with no corpus.
[tool.hatch.build.targets.wheel.force-include]
"data" = "killscore/data"

[tool.hatch.build.targets.sdist]
include = ["killscore", "data", "scripts", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
exclude = ["killscore/checks/node/node_modules"]

# Single pytest config for the whole repo. Do NOT add [tool.pytest.ini_options] to
# apps/api/pyproject.toml if one is ever added there: pytest uses exactly one config
# file (the nearest one going up), so a second table would silently take over for any
# invocation inside apps/api and diverge from root-level runs.
[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
# "apps/api" is what makes `app` importable. Drop it once apps/api becomes a real
# pip-installed package, otherwise `app` gets two module identities.
pythonpath = [".", "apps/api"]
norecursedirs = ["tests/fixtures", "demo-repos", ".venv", "node_modules", "mutants"]
addopts = "-ra"

# Self-audit: these are deliberately broken sample repositories, not killscore's code.
[tool.killscore]
exclude = ["tests/fixtures", "demo-repos"]

[tool.ruff]
line-length = 100
# Fixtures are deliberately malformed/unpinned sample repos, not project code.
extend-exclude = ["tests/fixtures", "demo-repos"]

# Matches the import style already used in apps/api: one alphabetical run per section,
# with `import x` and `from x import y` interleaved by module name.
[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
