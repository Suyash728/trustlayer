{# Severity counts. The number is ink; the colour is a small mark beside it, so a
   status colour never carries meaning on its own. #}
<span class="inline-flex items-center gap-3 text-xs">
  {% for name in ("high", "medium", "low") %}
    {% set value = counts.get(name, 0) %}
    <span class="inline-flex items-center gap-1.5 {% if not value %}ink-3{% endif %}">
      <span class="mark mark-{{ name }}" {% if not value %}style="opacity:.28"{% endif %}></span>
      <span {% if value %}class="ink-2"{% endif %}>{{ value }} {{ name }}</span>
    </span>
  {% endfor %}
</span>
