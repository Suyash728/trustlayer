# TrustLayer as a GitHub Action: run a check, upload SARIF to code scanning, and fail the
# job on the same exit codes the CLI uses (0 clean, 1 medium, 2 high, 3 operational error).
#
#   permissions:
#     contents: read
#     security-events: write   # needed for the SARIF upload
#   steps:
#     - uses: actions/checkout@v7
#     - uses: Suyash728/trustlayer@v0.2.0
#       with:
#         args: --all
#         fail-on: high
#
# Action refs below were checked to exist on 2026-11-20.
name: TrustLayer
description: Mechanical verification of AI-written code. Every finding carries evidence; no model decides.
branding:
  icon: check-circle
  color: green

inputs:
  command:
    description: "`audit` or `deps`."
    default: audit
  path:
    description: Directory to check, relative to the workspace.
    default: "."
  args:
    description: Extra CLI arguments, e.g. `--all` or `--only slopsquat` or `--baseline .trustlayer-baseline.json`.
    default: ""
  fail-on:
    description: Lowest severity that fails the job (high|medium|low).
    default: medium
  upload-sarif:
    description: Upload results to GitHub code scanning.
    default: "true"
  sarif-category:
    description: Category for the SARIF upload, to keep several runs apart.
    default: trustlayer

outputs:
  exit-code:
    description: The CLI's exit code.
    value: ${{ steps.run.outputs.exit-code }}
  sarif-file:
    description: Path to the SARIF file.
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.12"

    - id: run
      shell: bash
      # Inputs arrive through env, never interpolated into the script, so a crafted input
      # cannot inject shell.
      env:
        TL_COMMAND: ${{ inputs.command }}
        TL_PATH: ${{ inputs.path }}
        TL_ARGS: ${{ inputs.args }}
        TL_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$TL_COMMAND" in
          audit) extra=(--no-save) ;;
          deps) extra=() ;;
          *) echo "::error::command must be audit or deps, got '$TL_COMMAND'"; exit 3 ;;
        esac
        sarif="$RUNNER_TEMP/trustlayer-$TL_COMMAND.sarif"
        set +e
        # shellcheck disable=SC2086 # TL_ARGS is a list of arguments on purpose
        uvx --from "$GITHUB_ACTION_PATH" trustlayer "$TL_COMMAND" "$TL_PATH" "${extra[@]}" \
          --format sarif --fail-on "$TL_FAIL_ON" $TL_ARGS > "$sarif"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "trustlayer $TL_COMMAND exited $code (0 clean, 1 medium, 2 high, 3 operational error)"

    # Exit 3 means the tool could not run, so there is no SARIF worth uploading.
    - if: ${{ always() && inputs.upload-sarif == 'true' && steps.run.outputs.exit-code != '3' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: ${{ inputs.sarif-category }}

    - shell: bash
      env:
        TL_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$TL_CODE"
